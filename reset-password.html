<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set New Password | AssetGuard Pro</title>
  <script src="ag-utils.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="ag-config.js"></script>
  <style>
    :root { color-scheme: light; --ink:#071522; --teal:#00a879; --muted:#61736f; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; font-family:'Plus Jakarta Sans',system-ui,sans-serif; color:var(--ink); background:radial-gradient(circle at 15% 15%,#d9fff3,transparent 38%),linear-gradient(135deg,#effffb,#d7fff4 45%,#edffff); }
    main { width:min(100%,420px); padding:30px; border:1px solid rgba(7,21,34,.08); border-radius:22px; background:rgba(255,255,255,.94); box-shadow:0 20px 60px rgba(7,40,35,.12); }
    h1 { margin:0 0 8px; font-size:24px; } p { margin:0 0 24px; color:var(--muted); line-height:1.5; font-size:14px; }
    label { display:block; margin:14px 0 6px; font-size:12px; font-weight:700; } input { width:100%; padding:13px; border:1px solid #d7e5e1; border-radius:10px; font:inherit; } button { width:100%; margin-top:20px; padding:13px; border:0; border-radius:10px; background:var(--ink); color:#fff; font-weight:700; cursor:pointer; } button:disabled { opacity:.6; cursor:wait; }
    #status { min-height:20px; margin-top:14px; font-size:13px; color:#b42318; } .success { color:#087443 !important; }
  </style>
</head>
<body>
  <main>
    <h1>Set a new password</h1>
    <p id="intro">Choose a password for your AssetGuard account.</p>
    <form id="resetForm">
      <label for="newPassword">New password</label>
      <input id="newPassword" type="password" minlength="6" autocomplete="new-password" required>
      <label for="confirmPassword">Confirm password</label>
      <input id="confirmPassword" type="password" minlength="6" autocomplete="new-password" required>
      <button id="submitButton" type="submit">Save new password</button>
    </form>
    <div id="status" role="status"></div>
  </main>
  <script>
    if (!firebase.apps.length) firebase.initializeApp(AG_FIREBASE_CONFIG);
    const auth = firebase.auth();
    const params = new URLSearchParams(window.location.search);
    const status = document.getElementById("status");
    const form = document.getElementById("resetForm");
    const button = document.getElementById("submitButton");
    const expiresAt = Number(params.get("expires"));
    const actionCode = params.get("oobCode");

    function setStatus(message, success = false) {
      status.textContent = message;
      status.className = success ? "success" : "";
    }

    function getExpiryFromContinueUrl() {
      try {
        const continueUrl = params.get("continueUrl");
        return continueUrl ? Number(new URL(continueUrl).searchParams.get("expires")) : 0;
      } catch (_) { return 0; }
    }

    const deadline = expiresAt || getExpiryFromContinueUrl();
    if (!actionCode) {
      form.style.display = "none";
      setStatus("This password-reset link is incomplete or invalid.");
    } else if (!deadline || Date.now() > deadline) {
      form.style.display = "none";
      setStatus("This password-reset link expired after 30 minutes. Please request a new one from the login or settings page.");
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const password = document.getElementById("newPassword").value;
      const confirmation = document.getElementById("confirmPassword").value;
      if (Date.now() > deadline) return setStatus("This password-reset link expired after 30 minutes. Please request a new one.");
      if (password.length < 6) return setStatus("Password must be at least 6 characters.");
      if (password !== confirmation) return setStatus("Passwords do not match.");
      button.disabled = true;
      button.textContent = "Saving...";
      try {
        await auth.confirmPasswordReset(actionCode, password);
        form.style.display = "none";
        setStatus("Password updated. You can now sign in.", true);
        setTimeout(() => { window.location.href = "login.html"; }, 1800);
      } catch (error) {
        setStatus(error.code === "auth/expired-action-code" ? "This reset link has expired. Please request a new one." : "This reset link is invalid or has already been used.");
        button.disabled = false;
        button.textContent = "Save new password";
      }
    });
  </script>
</body>
</html>

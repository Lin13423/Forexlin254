<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Expense History - AssetGuard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #ef4444; --dark-bg: #001A35; --text-muted: #64748b; }
        body { font-family: 'Poppins', sans-serif; background: var(--dark-bg); margin: 0; padding: 10px; color: #1e293b; }
        .search-input { width: 100%; padding: 12px; border-radius: 10px; border: none; margin-bottom: 15px; }
        .stats-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 15px; }
        .stat-card { background: white; padding: 20px; border-radius: 12px; text-align: center; }
        .stat-card h4 { margin: 0; font-size: 12px; color: var(--text-muted); text-transform: uppercase; }
        .stat-card p { margin: 5px 0 0; font-size: 24px; font-weight: 800; color: var(--primary); }
        .history-card { background: white; border-radius: 15px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { background: #f8fafc; padding: 12px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #f1f5f9; }
        .cat-badge { background: #fee2e2; color: #ef4444; padding: 4px 8px; border-radius: 5px; font-size: 11px; font-weight: bold; }
    </style>
</head>
<body>
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search expenses..." onkeyup="filterTable()">
    <div class="stats-grid">
        <div class="stat-card"><h4>Total Business Expenses</h4><p id="total-exp">KES 0.00</p></div>
    </div>
    <div class="history-card">
        <div class="table-scroll">
            <table>
                <thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Amount</th></tr></thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
    </div>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";
    const firebaseConfig = { /* YOUR CONFIG */ };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    onValue(ref(db, 'expenses'), (snapshot) => {
        const tbody = document.getElementById('tbody');
        const data = snapshot.val();
        let total = 0;
        tbody.innerHTML = "";
        if (data) {
            Object.keys(data).reverse().forEach(key => {
                const e = data[key];
                const amt = parseFloat(e.amount || 0);
                total += amt;
                const ds = new Date(e.timestamp).toLocaleDateString('en-GB');
                tbody.insertAdjacentHTML('beforeend', `
                    <tr>
                        <td>${ds}</td>
                        <td><span class="cat-badge">${e.category || 'Other'}</span></td>
                        <td>${e.description || 'N/A'}</td>
                        <td style="font-weight:800; color:var(--primary)">${amt.toFixed(2)}</td>
                    </tr>
                `);
            });
        }
        document.getElementById('total-exp').innerText = "KES " + total.toLocaleString();
    });
</script>
</body>
</html>
